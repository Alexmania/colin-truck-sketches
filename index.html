<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#f6f4ef; color:#222; }
  header { position:sticky; top:0; z-index:5; background:#fff8ec; border-bottom:2px solid #f0b429; padding:12px 16px; }
  h1 { margin:0 0 2px; font-size:22px; }
  .sub { color:#666; font-size:14px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  #search { flex:1 1 180px; padding:10px 12px; font-size:16px; border:1.5px solid #ccc; border-radius:10px; }
  .chip { padding:9px 13px; border-radius:999px; border:1.5px solid #d8b25c; background:#fff; font-size:14px; cursor:pointer; min-height:44px; }
  .chip.on { background:#f0b429; border-color:#f0b429; font-weight:700; }
  main { padding:8px 14px 40px; max-width:1200px; margin:0 auto; }
  h2.group { font-size:17px; margin:22px 2px 10px; color:#7a5200; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .card { background:#fff; border:1px solid #e3ddd0; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .card img { width:100%; aspect-ratio:11/8.5; object-fit:cover; background:#fff; display:block; cursor:pointer; }
  .card .body { padding:8px 10px 10px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .card .t { font-weight:600; font-size:14.5px; line-height:1.25; }
  .tag { font-size:11.5px; color:#8a6d1a; background:#fdf0cd; border-radius:6px; padding:2px 7px; align-self:flex-start; }
  .dl { margin-top:auto; display:block; text-align:center; background:#f0b429; color:#222; font-weight:700; text-decoration:none; padding:11px; border-radius:9px; font-size:15px; }
  .empty { text-align:center; color:#888; padding:40px 0; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; z-index:20; flex-direction:column; }
  #modal.open { display:flex; }
  #modal .bar { display:flex; flex-wrap:wrap; gap:10px; padding:12px; align-items:center; }
  #modal .title { color:#fff; font-weight:700; flex:1; font-size:16px; }
  #modal img { flex:1; object-fit:contain; width:100%; min-height:0; background:#fff; }
  .btn { padding:12px 18px; border-radius:10px; border:0; font-size:16px; font-weight:700; cursor:pointer; min-height:48px; }
  .btn.dl { background:#f0b429; color:#222; text-decoration:none; display:inline-block; }
  .btn.close { background:#fff; color:#222; }
  .note { color:#ccc; font-size:12.5px; padding:0 12px 10px; }
  #printImg { display:none; }
  @page { size: letter landscape; margin: 0; }
  @media print {
    body * { visibility:hidden; }
    #printImg { display:block; visibility:visible; position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  }
</style>
</head>
<body>
<header>
  <h1>🚒 Colin's Truck Sketch Archive</h1>

  <div class="controls">
    <input id="search" type="search" placeholder="Search sketches…">
  </div>
  <div class="controls" id="chips"></div>
</header>
<main id="main"></main>
<div id="modal">
  <div class="bar">
    <span class="title" id="mTitle"></span>
    <a class="btn dl" id="mDl" href="#" download>Download</a>
    <button class="btn" id="mPrint">Print</button>
    <button class="btn close" id="mClose">✕</button>
  </div>
  <img id="mImg" alt="">
  <div class="note">If Print doesn't start inside the app, Download the sketch first and print the saved image.</div>
</div>

const cats = ["All", ...new Set(DATA.map(x => x.c))];
let activeCat = "All", query = "";
const chipsEl = document.getElementById("chips");
cats.forEach(c => {
  const n = c === "All" ? DATA.length : DATA.filter(x => x.c === c).length;
  const b = document.createElement("button");
  b.className = "chip" + (c === "All" ? " on" : "");
  b.textContent = c + " (" + n + ")";
  b.onclick = () => { activeCat = c; document.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); b.classList.add("on"); render(); };
  chipsEl.appendChild(b);
});
document.getElementById("count").textContent = DATA.length + " sketches";
const main = document.getElementById("main");
function render() {
  const list = DATA.filter(x => (activeCat === "All" || x.c === activeCat) && x.t.toLowerCase().includes(query));
  main.innerHTML = "";
  if (!list.length) { main.innerHTML = '<div class="empty">No sketches match.</div>'; return; }
  let lastKey = "";
  let grid = null;
  list.forEach(x => {
    const key = x.d + "|" + x.b;
    if (key !== lastKey) {
      lastKey = key;
      const h = document.createElement("h2");
      h.className = "group";
      h.textContent = x.dl + " — " + x.b;
      main.appendChild(h);
      grid = document.createElement("div"); grid.className = "grid"; main.appendChild(grid);
    }
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = '<img loading="lazy" alt=""><div class="body"><div class="t"></div><span class="tag"></span><a class="dl" download>Download</a></div>';
    card.querySelector("img").src = x.th;
    card.querySelector(".t").textContent = x.t;
    card.querySelector(".tag").textContent = x.c;
    const a = card.querySelector(".dl"); a.href = x.f;
    card.querySelector("img").onclick = () => openModal(x);
    grid.appendChild(card);
  });
}
document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
const modal = document.getElementById("modal");
let current = null;
function openModal(x) {
  current = x;
  document.getElementById("mTitle").textContent = x.t;
  document.getElementById("mImg").src = x.f;
  document.getElementById("mDl").href = x.f;
  modal.classList.add("open");
}
document.getElementById("mClose").onclick = () => modal.classList.remove("open");
document.getElementById("mPrint").onclick = () => {
  const p = document.getElementById("printImg");
  p.src = current.f;
  setTimeout(() => window.print(), 350);
};
render();
</script>
